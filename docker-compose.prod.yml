# Production stack for a VPS: the app plus Caddy for automatic HTTPS.
# Standalone on purpose — run it with -f so there is no merge behaviour to
# reason about against the local docker-compose.yml:
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Requires a .env next to this file with DOMAIN, OPENAI_API_KEY and APP_TOKEN.
services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "8000"                # internal only; Caddy is the public entrypoint
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in .env}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      APP_TOKEN: ${APP_TOKEN:?set APP_TOKEN in .env, or the app is public}
    volumes:
      - ./mock_data:/srv/mock_data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      start_period: 20s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env, e.g. hr.aothman.org}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # certificates survive restarts
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:

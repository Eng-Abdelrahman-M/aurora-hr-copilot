services:
  - type: web
    name: aurora-hr-copilot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m app.rag
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: false   # deploys are triggered by CI (deploy hook) only after tests pass
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: PYTHON_VERSION
        value: 3.12.6

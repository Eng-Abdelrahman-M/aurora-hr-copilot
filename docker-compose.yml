services:
  app:
    build: .
    ports:
      - "8100:8000"          # http://localhost:8100
    environment:
      # Read from your .env (compose loads it automatically). The key is never
      # baked into the image — .env is in .dockerignore.
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in .env}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      APP_PASSWORD: ${APP_PASSWORD:-}   # unset = no login, which is fine locally
    volumes:
      # Mock HR tickets the agent creates survive a restart and stay readable
      # on the host — handy when demoing create_mock_hr_ticket.
      - ./mock_data:/srv/mock_data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      start_period: 20s
      retries: 3

services:
  app:
    build: .
    ports:
      # Bound to loopback on purpose. "8100:8000" would publish the app on
      # every interface — on a VPS that means the whole internet, bypassing
      # any reverse proxy and any TLS. localhost:8100 still works locally.
      - "127.0.0.1:8100:8000"
    environment:
      # Read from your .env (compose loads it automatically). The key is never
      # baked into the image — .env is in .dockerignore.
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in .env}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      APP_TOKEN: ${APP_TOKEN:-}         # unset = no gate, which is fine locally
      # Older name for the same secret. Some deployment platforms store it as
      # APP_PASSWORD and regenerate their env file on every deploy; passing
      # both through means a redeploy cannot silently disable the gate.
      APP_PASSWORD: ${APP_PASSWORD:-}
    volumes:
      # Mock HR tickets the agent creates survive a restart and stay readable
      # on the host — handy when demoing create_mock_hr_ticket.
      - ./mock_data:/srv/mock_data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      start_period: 20s
      retries: 3

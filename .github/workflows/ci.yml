name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache local embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/chroma
          key: chroma-onnx-v1
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Import / start check
        run: python -c "from app.main import app; print('app imports OK')"
      - name: Build RAG index (self-check)
        run: python -m app.rag
      - name: Tests (app start, MCP tool discovery + calls)
        run: pytest tests/ -v

  deploy:
    # Deploys ONLY if tests pass, via a Render deploy hook stored as a secret.
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK secret not set — skipping deploy."
          else
            curl -fsS -X POST "$HOOK" && echo "Render deploy triggered."
          fi
